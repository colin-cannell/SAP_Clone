# sap-v1 Ocean env. Hyperparameters below are plain, round-number defaults,
# NOT the output of a `puffer sweep` run (contrast robocode.ini's numbers,
# which visibly are - 0.00249552, 2.69591 layers, etc. come from one).
# Nobody has run a sweep for this env yet; treat every value under [train]
# and [policy] as a starting point to tune, not a validated setting.

[base]
env_name = sap

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[selfplay]
enabled = 1
max_size = 16
swap_winrate = 0.8
min_games = 2048
elo_init = 0
elo_k = 16
seed = 42
snapshot_interval = 1000000000
opp_timeout_steps = 500000000

[env]
num_agents = 2
# Optional: uncomment to make the episode sequence reproducible across a
# whole run (see ocean/sap/binding.c's my_init). Left unset by default so
# every vectorized instance draws its own stream from its env index.
# seed = 42

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
# Episodes here are short (<= 20 ticks, see docs/envs/sap-v1.md) and the
# env is cheap (no bots, no physics, no rendering) - this is a much smaller
# budget than robocode's 5e9 as a starting point, not a claim it's enough
# to converge well.
total_timesteps = 200_000_000
learning_rate = 0.0003
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 10
max_grad_norm = 0.5
ent_coef = 0.01
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.9
beta2 = 0.999
eps = 1e-5
minibatch_size = 8192
# A full episode is at most 20 ticks (SAP_MAX_TICKS), so a horizon well
# past that costs nothing extra - unlike robocode's 3000-tick episodes,
# there's no reason to truncate a rollout mid-episode here.
horizon = 24
vtrace_rho_clip = 2
vtrace_c_clip = 2
prio_alpha = 1
prio_beta0 = 0.7
